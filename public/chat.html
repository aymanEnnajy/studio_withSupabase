<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - FotoGenius</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.3s ease-out forwards;
        }

        @keyframes bounce-dot {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .bounce-dot {
            animation: bounce-dot 0.6s infinite ease-in-out;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        div::-webkit-scrollbar {
            width: 6px;
        }

        div::-webkit-scrollbar-track {
            background: transparent;
        }

        div::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 to-blue-100 h-screen flex items-center justify-center p-4">

    <!-- Chat Container -->
    <div
        class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden h-[85vh] flex flex-col relative border border-white/50 ring-1 ring-black/5">

        <!-- Header -->
        <div
            class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 p-4 shrink-0 shadow-md z-10 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-xl shadow-inner border border-white/10">
                    📸
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight tracking-tight">FotoGenius</h1>
                    <div class="flex items-center gap-1.5 opacity-90">
                        <span
                            class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.5)]"></span>
                        <p class="text-xs text-blue-50 font-medium tracking-wide">Assistant Photographie</p>
                    </div>
                </div>
            </div>

            <button onclick="clearChat()"
                class="text-white/70 hover:text-white hover:bg-white/10 p-2 rounded-full transition-all duration-200"
                title="Effacer la conversation">
                <i class="fas fa-trash-alt text-sm"></i>
            </button>
        </div>

        <!-- Chat Window (Messages) -->
        <div id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 relative scroll-smooth">
            <!-- Background Pattern -->
            <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
                style="background-image: radial-gradient(#6366f1 1px, transparent 1px); background-size: 20px 20px;">
            </div>

            <!-- Welcome Message -->
            <div class="flex items-start gap-3 animate-slide-in-left relative z-10">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-100 to-indigo-100 flex items-center justify-center text-sm border border-blue-200 shadow-sm shrink-0">
                    📸
                </div>
                <div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-sm shadow-sm max-w-[85%]">
                    <p class="font-bold text-blue-600 text-sm mb-1">Bonjour ! 👋</p>
                    <p class="text-gray-700 text-sm leading-relaxed">Je suis votre expert en photographie. Je peux vous
                        aider avec :</p>
                    <ul class="text-sm text-gray-600 mt-2 space-y-1.5 ml-4 list-disc marker:text-blue-400">
                        <li>Choix de matériel & caméras</li>
                        <li>Techniques d'éclairage</li>
                        <li>Conseils pour vos séances</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden px-4 py-2 bg-slate-50 border-t border-gray-100/50">
            <div class="flex items-center gap-2 ml-10">
                <div class="flex gap-1 bg-white px-3 py-2 rounded-full shadow-sm border border-gray-100 w-fit">
                    <div class="w-1.5 h-1.5 bg-blue-500 rounded-full bounce-dot"></div>
                    <div class="w-1.5 h-1.5 bg-blue-500 rounded-full bounce-dot delay-100"></div>
                    <div class="w-1.5 h-1.5 bg-blue-500 rounded-full bounce-dot delay-200"></div>
                </div>
                <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wider animate-pulse">L'IA
                    réfléchit...</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-100 shrink-0 z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
            <!-- Suggestions -->
            <div class="flex gap-2 overflow-x-auto pb-3 mb-1 no-scrollbar mask-gradient">
                <button onclick="setQuestion('Quel appareil pour débuter ?')"
                    class="whitespace-nowrap px-3 py-1.5 bg-blue-50 text-blue-600 text-xs font-medium rounded-full hover:bg-blue-100 transition-colors border border-blue-100/50">
                    📷 Appareil débutant
                </button>
                <button onclick="setQuestion('Conseils éclairage portrait')"
                    class="whitespace-nowrap px-3 py-1.5 bg-indigo-50 text-indigo-600 text-xs font-medium rounded-full hover:bg-indigo-100 transition-colors border border-indigo-100/50">
                    💡 Éclairage portrait
                </button>
            </div>

            <form onsubmit="sendMessage(event)" class="relative flex items-center gap-2">
                <input type="text" id="chatInput"
                    class="w-full bg-gray-50 text-gray-800 text-sm rounded-full px-5 py-3.5 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white focus:border-blue-500/50 border border-gray-200 transition-all placeholder:text-gray-400"
                    placeholder="Posez votre question..." autocomplete="off">
                <button type="submit"
                    class="absolute right-2 p-2 bg-blue-600 text-white rounded-full transition-all shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed group"
                    id="sendBtn">
                    <i
                        class="fas fa-paper-plane text-xs translate-x-[-1px] group-hover:translate-x-0 transition-transform"></i>
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-[10px] text-gray-400 font-medium flex justify-center items-center gap-1.5">
                    Powered by n8n AI
                    <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                    <button onclick="testConnection()" class="hover:text-blue-500 transition-colors">Test
                        Connexion</button>
                </p>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_URL: 'https://n8n.zackdev.io/webhook/0414cfcc-6e2d-48d3-9f6c-af7895f2142d/chat',
            SESSION_ID: 'session_' + Math.random().toString(36).substring(2, 9)
        };

        const elements = {
            window: document.getElementById('chatWindow'),
            input: document.getElementById('chatInput'),
            btn: document.getElementById('sendBtn'),
            typing: document.getElementById('typingIndicator')
        };

        // Auto-focus
        window.onload = () => elements.input.focus();

        function setQuestion(q) {
            elements.input.value = q;
            elements.input.focus();
        }

        function scrollToBottom() {
            setTimeout(() => {
                elements.window.scrollTo({
                    top: elements.window.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function addMessage(type, text, isError = false) {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (type === 'user') {
                div.className = "flex items-end justify-end gap-2 animate-fade-in mb-4";
                div.innerHTML = `
                    <div class="flex flex-col items-end max-w-[85%]">
                        <div class="bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-sm shadow-md text-sm leading-relaxed">
                            ${escapeHtml(text)}
                        </div>
                        <span class="text-[10px] text-gray-400 mt-1 mr-1">${time}</span>
                    </div>
                `;
            } else {
                div.className = "flex items-start gap-3 animate-fade-in mb-4";
                const contentClass = isError
                    ? "bg-red-50 border border-red-100 text-red-600"
                    : "bg-white border border-gray-100 text-gray-700";

                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-100 to-indigo-100 flex items-center justify-center text-sm border border-blue-200 shadow-sm shrink-0 mt-1">
                        📸
                    </div>
                    <div class="flex flex-col items-start max-w-[85%]">
                        <div class="${contentClass} p-4 rounded-2xl rounded-tl-sm shadow-sm text-sm leading-relaxed overflow-hidden">
                            ${formatMarkdown(text)}
                        </div>
                         <span class="text-[10px] text-gray-400 mt-1 ml-1">${time}</span>
                    </div>
                `;
            }

            elements.window.appendChild(div);
            scrollToBottom();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = elements.input.value.trim();
            if (!text) return;

            // User Message
            addMessage('user', text);
            elements.input.value = '';
            elements.input.disabled = true;
            elements.btn.disabled = true;

            // Show Typing
            elements.typing.classList.remove('hidden');
            scrollToBottom();

            try {
                // Call API
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatInput: text,
                        sessionId: CONFIG.SESSION_ID
                    })
                });

                if (!response.ok) throw new Error(\`Erreur \${response.status}\`);

                const data = await response.json();
                const reply = extractReply(data);

                // Bot Response
                elements.typing.classList.add('hidden');
                addMessage('bot', reply);

            } catch (error) {
                console.error(error);
                elements.typing.classList.add('hidden');
                addMessage('bot', "Désolé, je ne parviens pas à joindre le serveur. Veuillez réessayer.", true);
            } finally {
                elements.input.disabled = false;
                elements.btn.disabled = false;
                elements.input.focus();
            }
        }

        function extractReply(data) {
            if (typeof data === 'string') return data;
            if (data.output) return data.output;
            if (data.text) return data.text;
            if (data.message) return data.message;
            if (data.response) return data.response;
            if (data.answer) return data.answer;
            try { return JSON.stringify(data); } catch { return "Réponse reçue."; }
        }

        function clearChat() {
            elements.window.innerHTML = '';
            const welcome = `
                    < div class= "flex items-start gap-3 animate-slide-in-left" >
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-100 to-indigo-100 flex items-center justify-center text-sm border border-blue-200 shadow-sm shrink-0">📸</div>
                <div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-sm shadow-sm max-w-[85%]">
                    <p class="font-bold text-blue-600 text-sm mb-1">Conversation effacée.</p>
                </div>
            </div >`;
            elements.window.innerHTML = welcome;
        }

        // Utils
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function formatMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>')
                .replace(/^- (.*?)(?=\n|$)/gm, '• $1<br>')
                .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="text-blue-600 underline">$1</a>');
        }

        async function testConnection() {
            elements.btn.disabled = true;
            try {
                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chatInput: 'ping', sessionId: CONFIG.SESSION_ID })
                });
                alert(res.ok ? "Connexion OK ✅" : "Erreur Connexion ❌");
            } catch(e) {
                alert("Erreur: " + e.message);
            } finally {
                elements.btn.disabled = false;
            }
        }
    </script>
</body>

</html>
