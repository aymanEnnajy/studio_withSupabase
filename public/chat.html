<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoGenius - AI Photo Expert</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50">

<!-- Chat Widget Container -->
<div class="fixed left-5 bottom-5 z-50 font-sans">
    <!-- Chat Window -->
    <div id="chatWindow" class="w-96 h-[600px] bg-white rounded-2xl shadow-2xl flex flex-col mb-4 border border-gray-200 overflow-hidden hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="text-2xl">📸</div>
                <div>
                    <div class="font-semibold text-sm">FotoGenius Assistant</div>
                    <div class="text-xs opacity-90">Powered by n8n AI</div>
                </div>
            </div>
            <button id="closeChatBtn" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-xl cursor-pointer">
                ×
            </button>
        </div>
        
        <!-- Messages -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-3">
            <div class="max-w-[85%] self-start">
                <div class="bg-white p-3 rounded-2xl rounded-tl-sm border border-gray-200 text-gray-800 text-sm">
                    <span class="font-semibold">📸 FotoGenius:</span> Hello! I'm your AI photography expert connected to n8n. Ask me anything about photography!
                </div>
            </div>
        </div>
        
        <!-- Quick Suggestions -->
        <div class="p-3 bg-blue-50 border-t border-gray-200 flex flex-wrap gap-2">
            <button onclick="askQuestion('What is your studio address?')" class="px-3 py-1.5 bg-white text-gray-700 text-xs rounded-full border border-gray-300 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-colors">
                📍 Address
            </button>
            <button onclick="askQuestion('Best camera for beginners?')" class="px-3 py-1.5 bg-white text-gray-700 text-xs rounded-full border border-gray-300 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-colors">
                📷 Camera
            </button>
            <button onclick="askQuestion('Photography tips for portraits?')" class="px-3 py-1.5 bg-white text-gray-700 text-xs rounded-full border border-gray-300 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-colors">
                💡 Tips
            </button>
        </div>
        
        <!-- Input Area -->
        <div class="p-4 border-t border-gray-200 bg-white flex gap-3">
            <input 
                type="text" 
                id="chatInput"
                class="flex-1 px-4 py-3 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ask about photography..."
                autocomplete="off"
            >
            <button id="sendBtn" class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-full flex items-center justify-center text-lg hover:from-blue-600 hover:to-purple-700 transition-colors">
                ↑
            </button>
        </div>
    </div>
    
    <!-- Toggle Button -->
    <button id="chatToggleBtn" class="w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-full text-2xl shadow-xl hover:shadow-2xl hover:scale-105 transition-all flex items-center justify-center">
        📸
    </button>
</div>

<script>
// ⭐ CONFIGURATION - Utilisez votre Worker CloudFlare
const CONFIG = {
    // Votre Worker CloudFlare comme proxy
    PROXY_URL: 'https://studio-manager.ayman93011.workers.dev',
    
    // Info n8n (pour référence)
    N8N_ENDPOINT: 'https://n8n.zackdev.io/webhook/8fb77b0d-5185-4a6b-8640-de0f04cedbb4/chat',
    SESSION_ID: 'ac816a4dd4a0408a935bae156f008631'
};

class FotoGeniusChat {
    constructor() {
        this.sessionId = CONFIG.SESSION_ID;
        this.isOpen = false;
        this.isTyping = false;
        
        console.log('🤖 FotoGenius Chat - Using CloudFlare Proxy');
        console.log('🌐 Proxy:', CONFIG.PROXY_URL);
        
        this.init();
        this.testProxy();
    }
    
    init() {
        // Elements
        this.elements = {
            toggleBtn: document.getElementById('chatToggleBtn'),
            closeBtn: document.getElementById('closeChatBtn'),
            chatWindow: document.getElementById('chatWindow'),
            messages: document.getElementById('chatMessages'),
            input: document.getElementById('chatInput'),
            sendBtn: document.getElementById('sendBtn')
        };
        
        // Events
        this.elements.toggleBtn.addEventListener('click', () => this.toggleChat());
        this.elements.closeBtn.addEventListener('click', () => this.closeChat());
        this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
        this.elements.input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.sendMessage();
        });
        
        // Auto-open
        setTimeout(() => this.openChat(), 2000);
    }
    
    toggleChat() {
        this.isOpen ? this.closeChat() : this.openChat();
    }
    
    openChat() {
        this.elements.chatWindow.classList.remove('hidden');
        this.elements.input.focus();
        this.isOpen = true;
    }
    
    closeChat() {
        this.elements.chatWindow.classList.add('hidden');
        this.isOpen = false;
    }
    
    async sendMessage() {
        const message = this.elements.input.value.trim();
        if (!message) return;
        
        this.addMessage('user', message);
        this.elements.input.value = '';
        
        this.showTyping();
        
        try {
            const response = await this.callViaProxy(message);
            this.hideTyping();
            this.addMessage('bot', response);
            
        } catch (error) {
            console.error('Error:', error);
            this.hideTyping();
            this.addMessage('bot', 'Sorry, connection issue. Please try again.');
        }
    }
    
    async callViaProxy(message) {
        // Send to CloudFlare Worker
        const payload = {
            sessionId: this.sessionId,
            action: 'sendMessage',
            chatInput: message
        };
        
        console.log('📤 To Proxy:', payload);
        
        const response = await fetch(CONFIG.PROXY_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        console.log('📥 Proxy status:', response.status);
        
        const data = await response.json();
        console.log('📥 Proxy data:', data);
        
        if (!data.success) {
            throw new Error(data.error || 'Proxy error');
        }
        
        // Extract AI response
        return this.extractResponse(data.data);
    }
    
    extractResponse(data) {
        if (!data) return 'No response from AI';
        
        // If data is a string
        if (typeof data === 'string') {
            return data === this.sessionId ? 'AI processing...' : data;
        }
        
        // If data is object
        if (typeof data === 'object') {
            // Check for response fields
            if (data.response) return data.response;
            if (data.message) return data.message;
            if (data.text) return data.text;
            if (data.answer) return data.answer;
            
            // OpenAI format
            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content;
            }
            
            // Return stringified if nothing else
            return JSON.stringify(data).substring(0, 300);
        }
        
        return 'AI response received';
    }
    
    addMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `max-w-[85%] ${sender === 'bot' ? 'self-start' : 'self-end'}`;
        
        const content = document.createElement('div');
        content.className = `p-3 rounded-2xl text-sm ${sender === 'bot' ? 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm' : 'bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-tr-sm'}`;
        
        if (sender === 'bot') {
            content.innerHTML = `<span class="font-semibold">📸 FotoGenius:</span> ${text}`;
        } else {
            content.textContent = text;
        }
        
        div.appendChild(content);
        this.elements.messages.appendChild(div);
        
        // Scroll
        this.elements.messages.scrollTop = this.elements.messages.scrollHeight;
    }
    
    showTyping() {
        this.isTyping = true;
        
        const div = document.createElement('div');
        div.className = 'max-w-[85%] self-start';
        div.id = 'typingIndicator';
        div.innerHTML = `
            <div class="bg-white p-3 rounded-2xl rounded-tl-sm border border-gray-200 flex items-center gap-2">
                <div class="flex gap-1">
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style="animation-delay: -0.32s"></div>
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style="animation-delay: -0.16s"></div>
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
                </div>
                <span class="text-gray-500 text-xs">AI is typing...</span>
            </div>
        `;
        
        this.elements.messages.appendChild(div);
        this.elements.messages.scrollTop = this.elements.messages.scrollHeight;
    }
    
    hideTyping() {
        this.isTyping = false;
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }
    
    async testProxy() {
        console.log('🧪 Testing CloudFlare proxy...');
        
        try {
            const response = await fetch(CONFIG.PROXY_URL, {
                method: 'GET'
            });
            
            const data = await response.json();
            console.log('✅ Proxy test:', data);
            
        } catch (error) {
            console.error('❌ Proxy test failed:', error);
        }
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    window.chatbot = new FotoGeniusChat();
    
    // Quick question function
    window.askQuestion = function(question) {
        document.getElementById('chatInput').value = question;
        window.chatbot.sendMessage();
    };
    
    // Add bounce animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .animate-bounce {
            animation: bounce 1.4s infinite ease-in-out both;
        }
    `;
    document.head.appendChild(style);
    
    // Test direct connection
    window.testDirectN8n = async function() {
        console.log('🔍 Testing direct n8n connection...');
        
        try {
            const response = await fetch(CONFIG.N8N_ENDPOINT, {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: CONFIG.SESSION_ID,
                    action: 'sendMessage',
                    chatInput: 'test'
                })
            });
            console.log('Direct test (no-cors):', response);
        } catch (error) {
            console.log('Direct connection blocked (expected):', error.message);
        }
    };
    
    setTimeout(() => window.testDirectN8n(), 1000);
});
</script>

</body>
</html>
